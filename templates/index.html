<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Chatbot</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <!-- Link to the CSS stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>

    <div class="chat-container">

        <!-- Chat Header -->
        <header class="chat-header">
            <h1>Nexus AI</h1>
            <a href="/clear" class="clear-chat-btn" title="Clear conversation history">Clear Chat</a>
        </header>

        <!-- Main Chat Messages Area -->
        <main class="chat-messages" id="chat-messages">
            <!-- Initial Greeting or History -->
            {% for message in chat_history %}
            {% if message.role == 'user' %}
            <div class="message user-message">
                <div class="message-content">{{ message.parts[0] }}</div>
            </div>
            {% else %}
            <div class="message model-message">
                <div class="avatar">AI</div>
                <div class="message-content markdown-body" data-markdown="{{ message.parts[0] }}"></div>
            </div>
            {% endif %}
            {% endfor %}

            <!-- Thinking Indicator (Hidden by default) -->
            <div class="message model-message" id="thinking-indicator" style="display: none;">
                <div class="avatar">AI</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Chat Input Form -->
        <footer class="chat-input-area">
            <form id="chat-form">
                <input type="text" id="message-input" name="message" placeholder="Type your message to Nexus AI..."
                    autocomplete="off" required>
                <button type="submit" id="send-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>

    </div>

    <script>
        // Initialize Highlight.js
        hljs.highlightAll();

        // Render initial markdown content
        document.querySelectorAll('.markdown-body').forEach(el => {
            const rawMarkdown = el.getAttribute('data-markdown');
            if (rawMarkdown) {
                el.innerHTML = marked.parse(rawMarkdown);
                el.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            }
        });

        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const thinkingIndicator = document.getElementById('thinking-indicator');

        // Scroll to bottom function
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Initial scroll
        scrollToBottom();

        chatForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const message = messageInput.value.trim();
            if (!message) return;

            // 1. Add User Message to UI (append to end)
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.innerHTML = `<div class="message-content">${escapeHtml(message)}</div>`;
            chatMessages.appendChild(userMsgDiv);

            // Clear input
            messageInput.value = '';
            scrollToBottom();

            // 2. Show Thinking Indicator (move to end and show)
            thinkingIndicator.style.display = 'flex';
            chatMessages.appendChild(thinkingIndicator);
            scrollToBottom();

            try {
                // 3. Send Request
                const response = await fetch('/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                // 4. Hide Thinking Indicator
                thinkingIndicator.style.display = 'none';

                if (data.ai_response) {
                    // 5. Add AI Response to UI (append to end)
                    const aiMsgDiv = document.createElement('div');
                    aiMsgDiv.className = 'message model-message';

                    // Parse Markdown
                    const htmlContent = marked.parse(data.ai_response);

                    aiMsgDiv.innerHTML = `
                        <div class="avatar">AI</div>
                        <div class="message-content markdown-body">${htmlContent}</div>
                    `;

                    chatMessages.appendChild(aiMsgDiv);

                    // Highlight code blocks in the new message
                    aiMsgDiv.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });
                }

            } catch (error) {
                console.error('Error:', error);
                thinkingIndicator.style.display = 'none';
                // Show error message
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message model-message error';
                errorDiv.innerHTML = `<div class="message-content">Error connecting to Nexus AI. Please try again.</div>`;
                chatMessages.appendChild(errorDiv);
            }

            scrollToBottom();
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>

</body>

</html>
